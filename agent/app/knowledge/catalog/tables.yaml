# 테이블 문서. columns 는 sdk_key 를 뺀 실제 컬럼과 같아야 한다 (tests/test_knowledge.py 가 DB 와 대조한다)
#  * summary: 한 줄 설명 (지식 베이스를 쓰는 모드에서는 시스템 프롬프트의 테이블 목록에도 쓰인다)
#  * grain: 한 행이 무엇인지
#  * use_for: 이 테이블로 답하는 질문 유형 (검색 키워드 역할도 한다)

- name: agg_daily_users
  summary: 날짜별 활동 방문자(client_id) 목록. 순 방문자 수(DAU/WAU/MAU) 계산용
  grain: 날짜 × 방문자
  columns:
    summary_date date: 활동 날짜
    client_id varchar: 방문자 식별자
  notes:
    - 하루 순 방문자 수 = 그 날짜의 행 수 (count(*))
    - 여러 날의 순 방문자 수는 count(DISTINCT client_id) 로 중복을 제거한다. 일별 값을 더하면 안 된다
  use_for: [방문자 수, 순 방문자, 사용자 수, DAU, WAU, MAU, 일평균 방문자]

- name: agg_user_session_daily
  summary: 날짜 × 성별 × 연령대별 방문자·세션·세션 시간
  grain: 날짜 × gender × age_group
  columns:
    summary_date date: 세션 시작 날짜
    gender varchar: male / female / unknown
    age_group varchar: 10s, 20s, 30s, 40s, 50s, 60s+, unknown
    users bigint: 방문자 수
    sessions bigint: 세션 수
    session_duration_sum bigint: 세션 시간 합 (초)
  notes:
    - 하루 안에서는 users 를 성별·연령대에 걸쳐 합산해도 된다. 여러 날의 users 합은 순 방문자가 아니다
    - 일별 전체 세션 수 = 날짜별 sum(sessions)
  use_for: [성별 방문자, 연령대별 세션, 평균 세션 시간, 일별 세션 수, 요일별 세션]

- name: agg_user_session_hourly
  summary: 날짜 × 시간대 × 지역·연령·성별·기기·OS·브라우저별 방문자·세션
  grain: 날짜 × summary_hour × city × age_group × gender × device_type × device_os × browser
  columns:
    summary_date date: 세션 시작 날짜
    summary_hour smallint: 세션 시작 시각 (0~23시)
    city varchar: 지역 (Seoul, Busan, Gyeonggi-do 등)
    age_group varchar: 10s ~ 60s+, unknown
    gender varchar: male / female / unknown
    device_type varchar: desktop / mobile / tablet
    device_os varchar: Android, iOS, iPadOS, Windows, macOS, Linux
    browser varchar: Chrome, Safari, Samsung Internet, Edge, Whale, Firefox
    users bigint: 방문자 수 (행 사이 합산은 근사치)
    sessions bigint: 세션 수
    session_duration_sum bigint: 세션 시간 합 (초)
  notes:
    - 기기·OS·브라우저·지역별 세션 수와 세션 시간은 이 테이블을 쓴다
    - 순 방문자 수는 agg_daily_users 를 쓴다
  use_for: [기기 유형별 세션, 모바일 데스크톱 비교, 지역별 방문, 브라우저별, OS별, 시간대별 방문]

- name: agg_page_daily
  summary: 날짜 × 페이지별 페이지뷰, 순 방문자, 세션, 종료 수, 체류 시간
  grain: 날짜 × page_path
  columns:
    summary_date date: 날짜
    page_path text: 페이지 경로
    page_views bigint: 페이지뷰
    unique_users bigint: 그 페이지를 본 순 방문자 수 (하루 기준)
    sessions bigint: 그 페이지가 포함된 세션 수
    exits bigint: 그 페이지에서 세션이 끝난 수
    time_on_page_sum double precision: 체류 시간 합 (초)
    last_event_at timestamptz: 마지막 이벤트 시각
  use_for: [페이지뷰, 인기 페이지, 페이지 체류 시간, 페이지 종료율, 페이지 참여도]

- name: agg_event_daily
  summary: 날짜 × 이벤트별 발생 수와 순 방문자
  grain: 날짜 × event_name
  columns:
    summary_date date: 날짜
    event_name varchar: 이벤트 이름 (page_view, auto_click, add_to_cart, is_payment, is_signup, contact_submit)
    event_count bigint: 발생 건수
    unique_users bigint: 이벤트를 발생시킨 순 방문자 (하루 기준)
  use_for: [결제 건수, 회원가입 수, 장바구니 담기 수, 클릭 수, 이벤트 발생 건수]

- name: agg_event_page_daily
  summary: 날짜 × 이벤트 × 페이지별 발생 수와 순 방문자
  grain: 날짜 × event_name × page_path
  columns:
    summary_date date: 날짜
    event_name varchar: 이벤트 이름
    page_path text: 이벤트가 발생한 페이지
    event_count bigint: 발생 건수
    unique_users bigint: 순 방문자 (하루 기준)
  use_for: [페이지별 클릭 수, 상품 페이지별 장바구니 담기, 페이지별 이벤트]

- name: agg_traffic_hourly
  summary: 날짜 × 시간대 × 유입 경로(소스·매체·캠페인) × 랜딩 페이지별 세션, 이탈, 전환, 퍼널
  grain: 날짜 × summary_hour × traffic_source × traffic_medium × traffic_campaign × landing_page
  columns:
    summary_date date: 세션 시작 날짜
    summary_hour smallint: 세션 시작 시각 (0~23시)
    traffic_source varchar: 유입 소스 (naver, google, instagram, direct 등)
    traffic_medium varchar: 유입 매체 (cpc, organic, social, email, push, referral, none)
    traffic_campaign varchar: 캠페인. 없으면 빈 문자열('')
    landing_page text: 세션 시작 페이지
    users bigint: 방문자 수 (행 사이 합산은 근사치)
    sessions bigint: 세션 수
    bounced_sessions bigint: 참여하지 않은 세션 (10초 미만 체류이면서 1페이지 이하 조회, 전환 없음)
    conversions bigint: 전환 이벤트 발생 건수
    conversion_value_sum numeric: 전환 금액 합 (원)
    funnel_visits bigint: 방문자 수
    funnel_engaged bigint: 참여 방문자 수
    funnel_converted bigint: 전환 방문자 수
  notes:
    - 시간대별 세션 수, 유입 채널·캠페인 성과, 이탈률·참여율·전환율은 이 테이블로 계산한다
  use_for: [유입 채널별 세션, 유입 소스, 매체, 캠페인 성과, 이탈률, 참여율, 전환율, 매출, 시간대별 세션, 랜딩 페이지 성과]

- name: agg_funnel_links_daily
  summary: 날짜별 페이지 이동(source → target)이 있었던 세션 수
  grain: 날짜 × source × target
  columns:
    summary_date date: 날짜
    source text: 이전 페이지
    target text: 다음 페이지
    sessions bigint: 그 이동이 있었던 세션 수
  use_for: [페이지 이동, 퍼널 단계 전환, 장바구니에서 결제로 이동, 다음 페이지]

- name: agg_first_pages_daily
  summary: 날짜별 세션 시작(랜딩) 페이지와 세션 수
  grain: 날짜 × page_path
  columns:
    summary_date date: 날짜
    page_path text: 세션 시작 페이지
    sessions bigint: 세션 수
  use_for: [랜딩 페이지, 첫 페이지, 진입 페이지]

- name: agg_sankey_paths_daily
  summary: 날짜 × 세션별 페이지·이벤트 경로 배열
  grain: 날짜 × session_id
  columns:
    summary_date date: 세션 날짜
    session_id varchar: 세션 식별자
    url_path text[]: 세션 동안 본 페이지 순서
    event_path text[]: 세션 동안 발생한 이벤트 순서
  notes:
    - 배열 원소는 url_path[1] 부터 시작한다. 특정 경로를 포함한 세션은 '/cart' = ANY(url_path) 처럼 찾는다
  use_for: [사용자 경로, 세션 흐름, 경로 분석]

- name: events
  summary: 원천 이벤트. 집계 테이블로 답할 수 없는 조합(기기별 특정 페이지 세션, 이벤트 속성 등)에만 쓴다
  grain: 이벤트 1건
  columns:
    id bigint: 이벤트 id
    event_name varchar: 이벤트 이름
    timestamp timestamptz: 발생 시각
    client_id varchar: 방문자 식별자
    user_id varchar: 로그인 회원 id (비회원은 NULL)
    session_id varchar: 세션 식별자
    page_path text: 페이지 경로
    page_title text: 페이지 제목
    referrer text: 리퍼러
    traffic_source varchar: 유입 소스
    traffic_medium varchar: 유입 매체
    traffic_campaign varchar: 캠페인 (없으면 '')
    device_type varchar: desktop / mobile / tablet
    device_os varchar: 운영체제
    browser varchar: 브라우저
    city varchar: 지역
    user_gender varchar: 성별 (male / female, 비회원은 NULL)
    user_age smallint: 나이 (비회원은 NULL)
    element text: 클릭한 요소 이름 (auto_click)
    time_on_page_seconds double precision: 직전 페이지 체류 시간 (초)
    properties jsonb: 이벤트 속성
  notes:
    - WHERE 에 timestamp 기간 조건이 반드시 있어야 한다. 예 timestamp >= current_date - 7 AND timestamp < current_date
    - 특정 페이지를 본 세션 수는 count(DISTINCT session_id) 로 센다
    - properties 키 — is_payment {value, order_id, items, currency}, add_to_cart {value, product_id, quantity}, page_view {product_id}, is_signup {method}, contact_submit {category}, auto_click {tag}
    - 숫자 속성은 (properties->>'value')::numeric 처럼 변환한다
  use_for: [세션 단위 계산, 기기별 페이지 조회 세션, 결제 금액 상세, 주문, 클릭 요소, 회원·비회원]

- name: conversion_events
  summary: 전환으로 집계하는 이벤트 정의
  grain: 이벤트 이름
  columns:
    event_name varchar: 이벤트 이름
    description text: 설명
    is_active smallint: 1 이면 전환으로 집계
    created_at timestamptz: 생성 시각
    updated_at timestamptz: 수정 시각
  notes:
    - 현재 활성 전환 이벤트는 is_payment, is_signup 이다 (agg_traffic_hourly.conversions 에 반영)
  use_for: [전환 이벤트 정의, 무엇이 전환인가]

- name: daily_metrics
  summary: 대시보드 위젯용 배치 집계 — 방문·클릭 지표 (minutes_/hourly_/daily_/weekly_metrics)
  grain: 구간(10분/1시간/1일/7일) 하나
  columns:
    date date: 구간 시작 날짜 (minutes_/hourly_ 는 date_time timestamptz)
    clicks bigint: 클릭 수
    visitors bigint: 방문 수 (agg_daily_users 의 순 방문자와 정의가 다르다)
    new_visitors bigint: 신규 방문
    existing_visitors bigint: 재방문
    avg_session_seconds integer: 평균 세션 시간 (초)
  notes:
    - 최근 날짜가 늦게 반영된다. 신규·재방문처럼 이 테이블에만 있는 지표가 필요할 때만 쓴다
  use_for: [신규 방문자, 재방문자, 신규 재방문 비율]

- name: daily_click_summary
  summary: 대시보드 위젯용 배치 집계 — 세그먼트별 클릭 요약 (minutes_/hourly_/daily_/weekly_click_summary)
  grain: 구간 × segment_type × segment_value
  columns:
    date date: 구간 시작 날짜 (minutes_/hourly_ 는 date_time)
    segment_type varchar: user_gender / traffic_source / device_type / user_age
    segment_value varchar: 세그먼트 값 (user_age 는 10s, 20s ...)
    total_clicks bigint: 클릭 수
    total_users bigint: 클릭한 사용자 수
    avg_clicks_per_user double precision: 사용자당 클릭 수
  use_for: [세그먼트별 클릭 요약, 사용자당 클릭 수]

- name: daily_top_elements
  summary: 대시보드 위젯용 배치 집계 — 세그먼트별 Top 3 클릭 요소 (minutes_/hourly_/daily_/weekly_top_elements)
  grain: 구간 × segment_type × segment_value × rank
  columns:
    date date: 구간 시작 날짜 (minutes_/hourly_ 는 date_time)
    segment_type varchar: user_gender / traffic_source / device_type / user_age
    segment_value varchar: 세그먼트 값
    rank smallint: 1~3 순위
    element text: 클릭 요소 이름
    total_clicks bigint: 클릭 수
    user_count bigint: 클릭한 사용자 수
  use_for: [가장 많이 클릭한 요소, 인기 버튼, Top 클릭 요소]

- name: daily_user_distribution
  summary: 대시보드 위젯용 배치 집계 — 세그먼트별 사용자 분포 (minutes_/hourly_/daily_/weekly_user_distribution)
  grain: 구간 × segment_type × segment_value × dist_type × dist_value
  columns:
    date date: 구간 시작 날짜 (minutes_/hourly_ 는 date_time)
    segment_type varchar: user_gender / traffic_source / device_type / user_age
    segment_value varchar: 세그먼트 값
    dist_type varchar: ageGroup / device
    dist_value varchar: 분포 값
    user_count bigint: 사용자 수
  use_for: [세그먼트 안 연령 분포, 세그먼트 안 기기 분포]

- name: daily_page_stats
  summary: 대시보드 위젯용 배치 집계 — 페이지 통계와 다음 페이지 (minutes_/hourly_/daily_/weekly_page_stats)
  grain: 구간 × page_path
  columns:
    date date: 구간 시작 날짜 (minutes_/hourly_ 는 date_time)
    page_path text: 페이지 경로
    page_views bigint: 페이지뷰
    page_exits bigint: 종료 수
    drop_rate double precision: 이탈 비율
    next_pages jsonb: '[{"to": "/path", "count": 3}, ...] count 내림차순'
    avg_time_on_page_seconds double precision: 평균 체류 시간 (초)
  notes:
    - 페이지뷰·체류 시간은 agg_page_daily 를 우선 쓴다. 다음 페이지 목록이 필요할 때 쓴다
  use_for: [페이지 다음 이동, 페이지 이탈 비율 위젯]
