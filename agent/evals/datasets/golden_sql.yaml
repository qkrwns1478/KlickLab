- id: compare-08
  category: compare
  knowledge: [metric/sessions, glossary/campaigns, glossary/period_recent_days]
  question: 최근 7일과 그 전 7일의 nov_mega_sale 캠페인 세션 수를 비교해줘
  sql: |
    SELECT sum(sessions) FILTER (WHERE summary_date >= current_date - 7) AS recent_7d,
