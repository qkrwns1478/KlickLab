- id: lookup-21
  category: lookup
  knowledge: [metric/exit_rate, glossary/period_recent_days]
  question: 최근 7일 페이지뷰 200회 이상인 페이지 중 종료율(%)이 가장 높은 3개는?
  order_matters: true
  sql: |
    SELECT page_path, sum(exits) * 100.0 / NULLIF(sum(page_views), 0) AS exit_rate
    FROM agg_page_daily
    WHERE summary_date >= current_date - 7 AND summary_date < current_date
    GROUP BY page_path
    HAVING sum(page_views) >= 200
    ORDER BY exit_rate DESC
    LIMIT 3

- id: lookup-22
  category: lookup
  ci: true
  beyond_summary: true
  knowledge: [metric/new_returning_visitors, glossary/period_week]
  question: 지난주 신규 방문자 수와 재방문자 수는?
  sql: |
