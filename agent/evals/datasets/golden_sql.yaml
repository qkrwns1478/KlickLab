- id: compare-09
  category: compare
  knowledge: [metric/sessions, glossary/weekday, glossary/period_recent_days]
  question: 최근 28일 주말(토·일)과 평일의 하루 평균 세션 수를 비교해줘
  sql: |
    SELECT avg(sessions) FILTER (WHERE extract(isodow FROM summary_date) >= 6) AS weekend_avg,
           avg(sessions) FILTER (WHERE extract(isodow FROM summary_date) < 6) AS weekday_avg
    FROM (
        SELECT summary_date, sum(sessions) AS sessions
        FROM agg_user_session_daily
        WHERE summary_date >= current_date - 28 AND summary_date < current_date
        GROUP BY summary_date
    ) d

- id: compare-10
  category: compare
  knowledge: [metric/sessions, glossary/weekday, glossary/traffic_channels, glossary/period_recent_days]
  question: 최근 28일 요일별(ISO 요일 번호, 월=1) 이메일(email) 매체 유입 세션 수는?
  order_matters: true
  sql: |
    SELECT extract(isodow FROM summary_date) AS weekday, sum(sessions) AS sessions
    FROM agg_traffic_hourly
    WHERE traffic_medium = 'email'
      AND summary_date >= current_date - 28 AND summary_date < current_date
    GROUP BY weekday
    ORDER BY weekday

- id: compare-11
  category: compare
  ci: true
  knowledge: [metric/payments, glossary/devices, glossary/period_day]
  question: 15일 전과 14일 전의 기기 유형별 결제 완료 건수를 비교해줘
  sql: |
    SELECT device_type,
           count(*) FILTER (WHERE timestamp < current_date - 14) AS day_15_ago,
           count(*) FILTER (WHERE timestamp >= current_date - 14) AS day_14_ago
    FROM events
    WHERE event_name = 'is_payment'
      AND timestamp >= current_date - 15 AND timestamp < current_date - 13
    GROUP BY device_type

- id: compare-12
  category: compare
  knowledge: [metric/page_views, glossary/period_month]
  question: 지난달과 이번 달의 일평균 페이지뷰를 비교해줘
  sql: |
    SELECT avg(page_views) FILTER (WHERE summary_date < date_trunc('month', current_date)::date) AS last_month,
           avg(page_views) FILTER (WHERE summary_date >= date_trunc('month', current_date)::date) AS this_month
    FROM (
        SELECT summary_date, sum(page_views) AS page_views
        FROM agg_page_daily
        WHERE summary_date >= (date_trunc('month', current_date) - interval '1 month')::date
        GROUP BY summary_date
    ) d

- id: compare-13
  category: compare
  knowledge: [metric/conversions, glossary/period_recent_days, glossary/traffic_channels]
  question: 최근 7일과 그 전 7일의 유입 소스(traffic_source)별 전환 수를 비교해줘
  sql: |
    SELECT traffic_source,
           sum(conversions) FILTER (WHERE summary_date >= current_date - 7) AS recent_7d,
           sum(conversions) FILTER (WHERE summary_date < current_date - 7) AS previous_7d
    FROM agg_traffic_hourly
    WHERE summary_date >= current_date - 14 AND summary_date < current_date
    GROUP BY traffic_source

- id: compare-14
  category: compare
  knowledge: [metric/sessions, glossary/devices, glossary/period_recent_days]
  question: 최근 14일 일별 모바일과 데스크톱 세션 수를 날짜별 한 행에 나란히 보여줘
  order_matters: true
  sql: |
    SELECT summary_date,
           sum(sessions) FILTER (WHERE device_type = 'mobile') AS mobile,
           sum(sessions) FILTER (WHERE device_type = 'desktop') AS desktop
    FROM agg_user_session_hourly
    WHERE summary_date >= current_date - 14 AND summary_date < current_date
    GROUP BY summary_date
    ORDER BY summary_date

- id: compare-15
  category: compare
  knowledge: [metric/payment_session_rate, glossary/period_week, glossary/traffic_channels]
  question: 지난주 세션 200개 이상인 유입 소스(traffic_source) 중 결제한 세션 비율(%)이 가장 높은 3개는?
  order_matters: true
  sql: |
    SELECT traffic_source,
           count(DISTINCT session_id) FILTER (WHERE event_name = 'is_payment') * 100.0
               / NULLIF(count(DISTINCT session_id), 0) AS payment_session_rate
    FROM events
    WHERE timestamp >= date_trunc('week', current_date)::date - 7
      AND timestamp < date_trunc('week', current_date)::date
    GROUP BY traffic_source
    HAVING count(DISTINCT session_id) >= 200
    ORDER BY payment_session_rate DESC
    LIMIT 3
