[project]
name = "klicklab-agent"
version = "0.1.0"
description = "KlickLab text-to-SQL 기반 LLM 분석 에이전트 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "sqlglot>=26",
    "pyyaml>=6",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# 지식 베이스 임베딩을 로컬에서 계산할 때 (EMBEDDING_PROVIDER=local, bge-m3). 없으면 키워드 검색만 한다
embedding = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# GPU 빌드는 이미지가 수 GB 로 커진다. 질의 임베딩 1건은 CPU 로 충분하다
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# 프롬프트 본문은 줄바꿈이 모델 입력을 바꾸므로 길이 제한에서 제외한다
"app/agent/prompts.py" = ["E501"]
"app/knowledge/context.py" = ["E501"]
"evals/judges.py" = ["E501"]
