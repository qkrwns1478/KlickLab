name: agent

# 에이전트(agent/) 테스트와 회귀 평가.
#  test : lint + 단위 테스트 (DB 없이)
#  eval : PostgreSQL + 데모 시드 위에서 DB 통합 테스트, 평가셋 점검·안전성(guard·DB 계층), 검색 평가.
#         LLM 키(secrets)가 있으면 축소 평가셋(ci: true)으로 golden 정확도·에이전트 안전성까지 돌린다.
#
# 저장소 설정
#  secrets.GROQ_API_KEY / secrets.EXAONE_API_KEY : LLM 평가용 (없으면 LLM 단계를 건너뛴다)
#  vars.EVAL_LLM_PROVIDER                         : groq(기본) / exaone
#  vars.EVAL_MIN_GOLDEN                           : golden 실행 정확도 기준(%) (기본 80)

on:
  pull_request:
    paths:
      - "agent/**"
      - "backend/src/main/resources/db/migration/**"
      - "backend/seed/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "LLM 평가를 축소 평가셋 대신 전체 평가셋으로"
        type: boolean
        default: false

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: 단위 테스트 (DB 통합 테스트는 건너뛴다)
        run: uv run pytest -q

  eval:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: klicklab
          POSTGRES_USER: klicklab
          POSTGRES_PASSWORD: klicklab
          TZ: Asia/Seoul
          PGTZ: Asia/Seoul
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klicklab -d klicklab"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TZ: Asia/Seoul
      # psql (시드)
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: klicklab
      PGPASSWORD: klicklab
      PGDATABASE: klicklab
      # Spring 백엔드 (Flyway, 집계 백필)
      DB_URL: jdbc:postgresql://localhost:5432/klicklab
      DB_USERNAME: klicklab
      DB_PASSWORD: klicklab
      JWT_SECRET: ci-only-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef
      AGENT_RO_PASSWORD: agent_ro
      AGENT_RW_PASSWORD: agent
      # 에이전트
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_RO_PASSWORD: agent_ro
      DB_RW_PASSWORD: agent
      EMBEDDING_PROVIDER: none  # CI 는 키워드 검색만 (임베딩 모델 2.2GB)
      REPORTS: ${{ github.workspace }}/eval-reports
      HAS_LLM_KEY: ${{ secrets.GROQ_API_KEY != '' || secrets.EXAONE_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: agent

      - name: 평가용 DB 준비 (스키마 → 시드 → 집계 백필)
        run: bash agent/scripts/prepare_eval_db.sh

      - name: 지식 베이스 적재
        working-directory: agent
        run: uv run python -m app.knowledge.indexer --no-embedding

      - name: DB 통합 테스트
        working-directory: agent
        run: uv run pytest -q

      - name: 평가셋 점검 + 안전성 (guard·DB 계층, LLM 없음)
        working-directory: agent
        run: uv run python -m evals.run_eval check --out-dir "$REPORTS"

      - name: 지식 베이스 검색 평가 (키워드)
        working-directory: agent
        run: >-
          uv run python -m evals.run_retrieval_eval --modes keyword --min-recall 75
          --out-dir "$REPORTS"

      - name: LLM 회귀 평가
        if: env.HAS_LLM_KEY == 'true'
        working-directory: agent
        env:
          LLM_PROVIDER: ${{ vars.EVAL_LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EXAONE_API_KEY: ${{ secrets.EXAONE_API_KEY }}
          SUBSET: ${{ inputs.full && ' ' || '--ci' }}
        run: |
          uv run python -m evals.run_eval golden $SUBSET --label ci \
            --min-score "${{ vars.EVAL_MIN_GOLDEN || 80 }}" --out-dir "$REPORTS"
          uv run python -m evals.run_eval safety $SUBSET --agent --label ci \
            --min-score 100 --out-dir "$REPORTS"

      - name: 리포트 요약
        if: always()
        run: |
          shopt -s nullglob
          for f in "$REPORTS"/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval-reports/
          if-no-files-found: ignore
