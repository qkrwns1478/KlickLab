spring:
  application:
    name: klicklab
  # backend/.env 파일이 있으면 환경변수처럼 읽는다 (KEY=VALUE)
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klicklab}
    username: ${DB_USERNAME:klicklab}
    password: ${DB_PASSWORD:klicklab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-init-sql: SET TIME ZONE '${klicklab.timezone}'
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      # SDK 스크립트(public/analytics_sdk.js) 제공
      static-locations: classpath:/static/,file:./public/
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:4000}
  forward-headers-strategy: framework
  shutdown: graceful

# Prometheus 메트릭: http://localhost:9091/metrics
management:
  server:
    port: ${METRICS_PORT:9091}
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true

klicklab:
  timezone: Asia/Seoul
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-ttl: 15m
    refreshed-access-ttl: 150m
    refresh-ttl: 7d
  auth:
    auto-approve: ${AUTH_AUTO_APPROVE:false}
  rollup:
    enabled: ${ROLLUP_ENABLED:true}
    # 오늘 집계 갱신 주기 (초 분 시 일 월 요일)
    cron: "0 */5 * * * *"
    # 자정 이후 이 시간 동안은 어제 집계도 함께 재계산 (늦게 도착한 이벤트 반영)
    late-arrival-grace: 1h
    # 기동 시 최근 N일 중 집계 이력이 없는 날짜를 채움
    backfill-days-on-startup: 7

logging:
  level:
    http: INFO
